services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-radio}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radio_app}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      API_PORT: '3000'
      API_HOST: '0.0.0.0'
      API_CORS_ORIGIN: 'http://localhost:5173'
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-radio}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-radio_app}
      SERVICE_KEY: ${SERVICE_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-dev-secret}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
